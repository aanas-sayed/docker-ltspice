name: LTspice headless test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set cache week key
        run: echo "CACHE_WEEK=$(date -u +%Y-W%V)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: docker-ltspice:ci
          cache-from: type=gha,scope=ltspice-w${{ env.CACHE_WEEK }}
          cache-to: type=gha,scope=ltspice-w${{ env.CACHE_WEEK }},mode=max

      - name: Export image
        run: docker save docker-ltspice:ci | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: amd64-linux
          - runner: ubuntu-24.04-arm
            name: arm64-linux
          - runner: macos-latest
            name: apple-silicon
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Set up QEMU (arm64-linux only)
        if: matrix.name == 'arm64-linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Install Docker via Colima (apple-silicon only)
        if: matrix.name == 'apple-silicon'
        run: |
          brew install colima docker
          colima start --vm-type vz
          echo "DOCKER_HOST=unix://${HOME}/.colima/default/docker.sock" >> "$GITHUB_ENV"

      - name: Set up QEMU (apple-silicon only)
        if: matrix.name == 'apple-silicon'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Load image
        run: docker load < image.tar.gz

      - name: Run simulation test
        run: |
          chmod +x test.sh
          ./test.sh docker-ltspice:ci

      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc_filter_log-${{ matrix.name }}
          path: test/rc_filter.log
          if-no-files-found: warn
