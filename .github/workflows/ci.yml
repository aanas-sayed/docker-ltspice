name: CI

on:
  push:
  pull_request:
  schedule:
    # Check for a new LTspice release every Monday 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  # ── Decide whether this run should publish to Docker Hub ──────────────────
  # Publishes on:
  #   - push to main                              (always)
  #   - workflow_dispatch on main                 (always)
  #   - scheduled run AND the LTspice MSI ETag changed since the last publish
  # Never publishes on pull requests or non-main branches.
  check:
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.decide.outputs.value }}
    steps:
      - name: Fetch LTspice ETag
        if: github.event_name == 'schedule'
        id: etag
        run: |
          ETAG=$(curl -sI https://ltspice.analog.com/software/LTspice64.msi \
            | grep -i '^etag:' | awk '{print $2}' | tr -d '"\r\n')
          echo "value=$ETAG" >> "$GITHUB_OUTPUT"

      - name: Check ETag cache
        if: github.event_name == 'schedule'
        id: cache
        uses: actions/cache@v4
        with:
          path: .ltspice-etag-sentinel
          key: ltspice-etag-${{ steps.etag.outputs.value }}

      - name: Update ETag sentinel
        if: github.event_name == 'schedule' && steps.cache.outputs.cache-hit != 'true'
        run: echo "${{ steps.etag.outputs.value }}" > .ltspice-etag-sentinel

      - name: Decide
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "schedule" && "${{ steps.cache.outputs.cache-hit }}" == "true" ]]; then
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "LTspice MSI unchanged — skipping publish."
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

  # ── Build the image once and share it with the test matrix ────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set cache week key
        run: echo "CACHE_WEEK=$(date -u +%Y-W%V)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: docker-ltspice:ci
          cache-from: type=gha,scope=ltspice-w${{ env.CACHE_WEEK }}
          cache-to: type=gha,scope=ltspice-w${{ env.CACHE_WEEK }},mode=max

      - name: Export image
        run: docker save docker-ltspice:ci | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # ── Run the simulation test on each supported host architecture ───────────
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: amd64-linux
          - runner: ubuntu-24.04-arm
            name: arm64-linux
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Set up QEMU (arm64-linux only)
        if: matrix.name == 'arm64-linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Load image
        run: docker load < image.tar.gz

      - name: Run simulation test
        run: |
          chmod +x test.sh
          ./test.sh docker-ltspice:ci

      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc_filter_log-${{ matrix.name }}
          path: test/rc_filter.log
          if-no-files-found: warn

  # ── Publish to Docker Hub (only after tests pass, only when appropriate) ──
  publish:
    needs: [check, test]
    if: needs.check.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set cache week key
        run: echo "CACHE_WEEK=$(date -u +%Y-W%V)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags:
      #   latest              – always the newest image
      #   YYYY.MM.DD          – date of this build (overwritten if rebuilt same day)
      #   YYYY.MM.DD-<sha>    – unique per commit; preserves same-day rebuilds
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: aanas0sayed/docker-ltspice
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY.MM.DD'}}
            type=raw,value={{date 'YYYY.MM.DD'}}-{{sha}}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read from the cache warmed by the build job — instant rebuild.
          cache-from: type=gha,scope=ltspice-w${{ env.CACHE_WEEK }}
