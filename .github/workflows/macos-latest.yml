name: Publish macos-latest (Wine 9)

# Manually-triggered build of the macos-latest tag, pinned to Wine 9.x.
#
# Why a separate workflow:
#   The default `latest` tag tracks Wine stable (currently Wine 10), which
#   aborts under QEMU on 16 KB page-size hosts (Apple Silicon Macs via
#   Docker Desktop, Asahi Linux). Wine 9 does not exhibit that bug, so the
#   `macos-latest` tag stays pinned to Wine 9 until upstream #58084 ships.
#
# Tags published on every run:
#   - devel-YYYYMMDD-wine-<major.minor>  (immutable, audit trail — always pushed)
#   - <rolling_tag>                      (rolling pointer; defaults to
#                                         macos-latest, blank to skip)
#
# Run via the Actions tab → "Run workflow", optionally overriding the
# Wine version pin (e.g. to bump to a newer 9.x point release). Leave
# rolling_tag empty to publish only the dated devel tag — useful for
# trial builds that should not move the macos-latest pointer.

on:
  workflow_dispatch:
    inputs:
      wine_version:
        description: "Debian package version pin for wine-stable (e.g. 9.0.0.0~bookworm-1)"
        required: true
        default: "9.0.0.0~bookworm-1"
      rolling_tag:
        description: "Rolling tag to publish alongside the dated devel tag (leave blank to skip)"
        required: false
        default: "macos-latest"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute tags
        id: tags
        run: |
          DATE=$(date -u +%Y%m%d)
          # 9.0.0.0~bookworm-1 → 9.0
          WINE_SHORT=$(echo "${{ inputs.wine_version }}" | cut -d. -f1-2)
          DEVEL_TAG="devel-${DATE}-wine-${WINE_SHORT}"
          IMAGE=aanas0sayed/docker-ltspice
          # The dated devel tag is always pushed; the rolling pointer is
          # only included when the input is non-empty. Multi-line tag
          # output uses GITHUB_OUTPUT's heredoc form.
          {
            echo "list<<EOF"
            echo "${IMAGE}:${DEVEL_TAG}"
            if [ -n "${{ inputs.rolling_tag }}" ]; then
              echo "${IMAGE}:${{ inputs.rolling_tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.rolling_tag }}" ]; then
            echo "Will publish: ${IMAGE}:${DEVEL_TAG} and ${IMAGE}:${{ inputs.rolling_tag }}"
          else
            echo "Will publish: ${IMAGE}:${DEVEL_TAG} (no rolling tag)"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (load locally for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: docker-ltspice:macos-ci
          build-args: |
            WINE_BRANCH=stable
            WINE_VERSION=${{ inputs.wine_version }}
          cache-to: type=gha,scope=ltspice-wine9,mode=max

      - name: Run simulation test
        run: |
          chmod +x test.sh
          ./test.sh docker-ltspice:macos-ci

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            WINE_BRANCH=stable
            WINE_VERSION=${{ inputs.wine_version }}
          cache-from: type=gha,scope=ltspice-wine9
